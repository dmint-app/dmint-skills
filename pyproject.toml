[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dmint-skills"
version = "1.0.0"
description = "AI agent policy-authoring skills and system prompt guidance for Dmint"
license = "Apache-2.0"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmint_skills = ["skills/**/*.md", "skills/*.md"]
